[project]
name = "skill-deployment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["skill-assessment", "PyYAML>=6.0.2"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
